<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskSpace Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-primary fs-4"><i class="bi bi-check-circle-fill"></i> TaskSpace</span>
            
            <div id="auth-section" class="d-flex align-items-center ms-auto">
                <div id="notifications-area" class="dropdown me-4 d-none-auth">
                    <button id="notification-bell" class="btn btn-light position-relative rounded-circle shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Alertas">
                        <i class="bi bi-bell text-secondary" style="font-size: 1.3rem;"></i>
                        <span id="notif-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light" style="display: none;">0</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end notification-dropdown-menu" aria-labelledby="notification-bell">
                        <li class="dropdown-header bg-white fw-bold text-uppercase small py-2 border-bottom">Alertas de Vencimiento</li>
                        <div id="notification-list-content"></div>
                    </ul>
                </div>
                
                <div id="user-profile-area" class="dropdown d-none-auth">
                    <button class="btn btn-white border shadow-sm btn-sm dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3 py-1" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 text-secondary"></i>
                        <span id="user-display-name" class="fw-bold d-none d-sm-inline text-dark">Usuario</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="profileDropdown">
                        <li><button class="dropdown-item py-2" id="open-profile-settings"><i class="bi bi-gear me-2"></i> Configuración</button></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><button class="dropdown-item py-2 text-danger" id="logout-btn"><i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión</button></li>
                    </ul>
                </div>
                <button id="login-btn" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">Iniciar sesión</button>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="task-section" style="display: none;">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white rounded-3 shadow-sm border-start border-4 border-primary">
                    <h5 class="mb-0 fw-bold text-dark" id="pendingTasksHeader">Pendientes (0)</h5>
                    <div>
                        <button class="btn btn-light btn-sm rounded-circle me-1" data-bs-toggle="modal" data-bs-target="#settingsModal" data-list-type="pending" title="Ordenar/Preferencias">
                            <i class="bi bi-sliders"></i>
                        </button>
                        <button id="add-task-btn" class="btn btn-primary btn-sm rounded-circle shadow-sm" style="width: 32px; height: 32px;" data-bs-toggle="modal" data-bs-target="#taskModal" title="Nueva Tarea">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3 d-flex align-items-center px-2">
                    <div class="form-check me-3">
                        <input class="form-check-input bulk-checkbox" type="checkbox" id="selectAllPending">
                        <label class="form-check-label text-muted small user-select-none" for="selectAllPending">Seleccionar todo</label>
                    </div>
                    <div class="ms-auto d-flex align-items-center gap-2">
                        <select id="selectPendientes" class="form-select form-select-sm border-0 bg-transparent text-end fw-bold text-secondary" style="width: auto; cursor: pointer;">
                            <option value="none">Mostrar todo</option>
                            <option value="priority">Por Prioridad</option>
                            <option value="dateRange">Vencimiento</option> 
                            <option value="name">Por Nombre</option>
                        </select>
                        <div id="filterInputContainerPending" class="d-flex align-items-center gap-2"></div>
                        <button id="applyFilterPendingBtn" class="btn btn-sm btn-outline-secondary rounded-circle" style="display: none;" onclick="applyFilter(event)"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div id="pending-tasks"></div>
                <div id="pending-pagination-container" class="pagination-container d-flex justify-content-center mt-3"></div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white rounded-3 shadow-sm border-start border-4 border-success">
                    <h5 class="mb-0 fw-bold text-dark" id="completedTasksHeader">Completadas (0)</h5>
                    <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="modal" data-bs-target="#settingsModal" data-list-type="completed" title="Ordenar/Preferencias">
                        <i class="bi bi-sliders"></i>
                    </button>
                </div>
                <div class="mb-3 d-flex align-items-center px-2">
                    <div class="form-check me-3">
                        <input class="form-check-input bulk-checkbox" type="checkbox" id="selectAllCompleted">
                        <label class="form-check-label text-muted small user-select-none" for="selectAllCompleted">Seleccionar todo</label>
                    </div>
                    <div class="ms-auto d-flex align-items-center gap-2">
                        <select id="selectCompletadas" class="form-select form-select-sm border-0 bg-transparent text-end fw-bold text-secondary" style="width: auto; cursor: pointer;">
                            <option value="none">Mostrar todo</option>
                            <option value="dateRange">Finalización</option>
                            <option value="priority">Por Prioridad</option>
                            <option value="name">Por Nombre</option>
                        </select>
                        <div id="filterInputContainerCompleted" class="d-flex align-items-center gap-2"></div>
                        <button id="applyFilterCompletedBtn" class="btn btn-sm btn-outline-secondary rounded-circle" style="display: none;" onclick="applyFilter(event)"><i class="bi bi-search"></i></button>
                    </div>
                </div>
                <div id="completed-tasks"></div>
                <div id="completed-pagination-container" class="pagination-container d-flex justify-content-center mt-3"></div>
            </div>
        </div>
    </main>
    
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white border-0 rounded-top-4">
                   <h5 class="modal-title fw-bold" id="taskModalLabel"><i class="bi bi-pencil-square me-2"></i>Detalles de Tarea</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="newTaskForm">
                        <input type="hidden" id="taskID" value=""> 
                        <div class="mb-3">
                            <label class="form-label text-secondary small fw-bold">TÍTULO DE LA TAREA</label> 
                            <input type="text" class="form-control form-control-lg bg-light" id="taskName" required maxlength="100" placeholder="Ej: Pagar servicios">
                        </div>
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label class="form-label text-secondary small fw-bold">FECHA DE VENCIMIENTO</label>
                                <input type="datetime-local" class="form-control" id="taskDateTime" required> 
                            </div>
                            <div class="col-md-5">
                                <label class="form-label text-secondary small fw-bold">PRIORIDAD</label>
                                <select class="form-select" id="taskPriority">
                                    <option value="urgente" class="priority-color-urgente">🔥 Urgente</option>
                                    <option value="alta" class="priority-color-alta">⬆️ Alta</option>
                                    <option value="media" selected class="priority-color-media">⏺️ Media</option>
                                    <option value="baja" class="priority-color-baja">⬇️ Baja</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3 mt-3">
                             <label class="form-label text-secondary small fw-bold">NOTAS ADICIONALES</label>
                             <textarea class="form-control bg-light" id="taskNotes" rows="3" placeholder="Descripción opcional..."></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-warning fw-bold px-4 shadow-sm" id="readOnlyUncompleteBtn" style="display:none;"><i class="bi bi-arrow-counterclockwise me-1"></i> Desmarcar</button>
                            <button type="button" class="btn btn-danger fw-bold px-4 shadow-sm" id="readOnlyDeleteBtn" style="display:none;"><i class="bi bi-trash me-1"></i> Eliminar</button>
                            <button type="button" class="btn btn-light text-muted fw-bold" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary fw-bold px-4 shadow-sm" id="saveTaskBtn">Guardar Tarea</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold text-secondary">Preferencias de Lista</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body pt-2" id="settings-content"></div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="profileSettingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-gear-fill me-2 text-primary"></i>Configuración</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <form id="profileSettingsForm">
                        <div class="mb-4">
                            <h6 class="fw-bold text-dark mb-3">🔔 Alertas </h6>
                            <div class="card bg-light border-0 mb-3 rounded-3">
                                <div class="card-body">
                                    <div class="form-check form-switch d-flex align-items-center justify-content-between ps-0 mb-2">
                                        <label class="form-check-label fw-bold cursor-pointer" for="bellEnabled">Activar Alertas</label>
                                        <input class="form-check-input ms-2" type="checkbox" id="bellEnabled" style="cursor: pointer;">
                                    </div>
                                    <div id="bellConfigContainer" class="mt-3 border-top pt-3" style="display: none;">
                                         <label class="form-label small text-muted mb-1">Avisarme con una anticipación de:</label>
                                        <div class="input-group">
                                            <input type="number" class="form-control" id="bellValue" min="1" value="1">
                                            <select class="form-select bg-white" id="bellUnit" style="flex: 2;">
                                                <option value="m">Minuto(s)</option>
                                                <option value="h" selected>Hora(s)</option>
                                                <option value="d">Día(s)</option>
                                                <option value="w">Semana(s)</option>
                                                <option value="mo">Mes(es)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mb-4">
                            <h6 class="fw-bold text-dark mb-3">📧 Resumen de Tareas por Email</h6>
                            <div class="card bg-light border-0 mb-3 rounded-3">
                                <div class="card-body">
                                    <div class="form-check form-switch d-flex align-items-center justify-content-between ps-0 mb-2">
                                        <label class="form-check-label fw-bold cursor-pointer" for="emailSummaryEnabled">Activar Resumen</label>
                                        <input class="form-check-input ms-2" type="checkbox" id="emailSummaryEnabled" style="cursor: pointer;">
                                    </div>
                                    <div id="emailSummaryConfigContainer" class="mt-3 border-top pt-3" style="display: none;">
                                        <label class="form-label small text-muted mb-1">Frecuencia de envío:</label>
                                        <div class="input-group">
                                            <select class="form-select bg-white" id="emailSummaryUnit" style="flex: 2;">
                                                <option value="d">Diaria</option>
                                                <option value="w">Semanal</option>
                                                <option value="mo" selected>Mensual</option>
                                                <option value="y">Anual</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="text-end pt-2">
                            <button type="button" class="btn btn-link text-decoration-none text-muted me-2" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary px-4 fw-bold rounded-pill">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="bulk-action-bar" class="fixed-bottom bg-dark text-white p-3 shadow-lg" style="display: none;">
        <div class="container d-flex justify-content-between align-items-center">
            <span id="selected-count" class="fw-bold small text-white-50">0 seleccionadas</span>
            <div>
                <button id="bulk-complete-btn" class="btn btn-sm btn-success me-2 fw-bold" disabled><i class="bi bi-check-lg me-1"></i> Completar</button>
                <button id="bulk-uncomplete-btn" class="btn btn-sm btn-warning me-2 fw-bold" disabled><i class="bi bi-arrow-counterclockwise me-1"></i> Desmarcar</button>
                <button id="bulk-delete-btn" class="btn btn-sm btn-danger fw-bold" disabled><i class="bi bi-trash me-1"></i> Eliminar</button>
           </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script type="module" src="./src/script.js"></script>
</body>
</html>
