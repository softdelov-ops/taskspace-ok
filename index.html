<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskSpace Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm px-4 sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand fw-bold text-primary fs-4">
                <i class="bi bi-check-circle-fill"></i> TaskSpace
            </span>
            
            <div id="auth-section" class="d-flex align-items-center ms-auto">
                <div id="notifications-area" class="dropdown me-4 d-none-auth">
                    <button id="notification-bell" class="btn btn-light position-relative rounded-circle shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" title="Alertas">
                       <i class="bi bi-bell text-secondary" style="font-size: 1.3rem;"></i>
                        <span id="notif-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger border border-light" style="display: none;">0</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end notification-dropdown-menu shadow-lg border-0" style="width: 320px; max-height: 400px; overflow-y: auto;">
                        <li class="dropdown-header bg-white fw-bold text-uppercase small py-2 border-bottom">Alertas de Vencimiento</li>
                        <div id="notification-list-content"></div>
                    </ul>
                </div>

                <div id="user-profile-area" class="dropdown d-none-auth">
                    <button class="btn btn-white border shadow-sm btn-sm dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3 py-1" type="button" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle fs-5 text-secondary"></i>
                        <span id="user-display-name" class="fw-bold d-none d-sm-inline text-dark">Usuario</span>
                        <img id="user-photo" src="https://via.placeholder.com/40" class="rounded-circle border shadow-sm" width="40" height="40">
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                        <li>
                            <button class="dropdown-item py-2" data-bs-toggle="modal" data-bs-target="#profileSettingsModal">
                                <i class="bi bi-gear me-2 text-secondary"></i> Configuración de Perfil
                            </button>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item py-2 text-danger" id="logout-btn">
                                <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
                            </button>
                        </li>
                    </ul>
                </div>

                <button id="login-btn" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                    <i class="bi bi-google me-2"></i> Iniciar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4" id="task-section" style="display: none;">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white rounded-3 shadow-sm border-start border-4 border-primary">
                    <h5 class="mb-0 fw-bold text-dark" id="pendingTasksHeader">Pendientes (0)</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="modal" data-bs-target="#settingsModal" data-list-type="pending" title="Configurar lista">
                            <i class="bi bi-sliders"></i>
                        </button>
                        <button class="btn btn-primary btn-sm rounded-circle shadow-sm" id="add-task-btn" data-bs-toggle="modal" data-bs-target="#taskModal" style="width: 32px; height: 32px;">
                            <i class="bi bi-plus-lg"></i>
                        </button>
                    </div>
                </div>

                <div class="mb-3 d-flex align-items-center px-2 flex-wrap gap-2">
                    <div class="form-check me-2">
                        <input class="form-check-input bulk-checkbox" type="checkbox" id="selectAllPending">
                        <label class="form-check-label text-muted small user-select-none" for="selectAllPending">Marcar todo</label>
                    </div>
                    <div class="ms-auto d-flex align-items-center gap-2">
                        <select id="selectPendientes" class="form-select form-select-sm border-0 bg-transparent text-end fw-bold text-secondary" style="width: auto; cursor: pointer;">
                            <option value="none">Mostrar todo</option>
                            <option value="name">Por Nombre</option>
                            <option value="priority">Por Prioridad</option>
                            <option value="dateRange">Rango Fecha</option>
                        </select>
                        <div id="filterInputContainerPending" class="d-flex align-items-center gap-2"></div>
                    </div>
                </div>

                <div id="pending-tasks"></div>
                <div id="pending-pagination-container" class="pagination-container d-flex justify-content-center mt-3"></div>
            </div>

            <div class="col-md-6 mb-4">
                <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white rounded-3 shadow-sm border-start border-4 border-success">
                    <h5 class="mb-0 fw-bold text-dark" id="completedTasksHeader">Completadas (0)</h5>
                    <button class="btn btn-light btn-sm rounded-circle" data-bs-toggle="modal" data-bs-target="#settingsModal" data-list-type="completed">
                        <i class="bi bi-sliders"></i>
                    </button>
                </div>

                <div class="mb-3 d-flex align-items-center px-2 flex-wrap gap-2">
                    <div class="form-check me-2">
                        <input class="form-check-input bulk-checkbox" type="checkbox" id="selectAllCompleted">
                        <label class="form-check-label text-muted small user-select-none" for="selectAllCompleted">Marcar todo</label>
                    </div>
                    <div class="ms-auto d-flex align-items-center gap-2">
                        <select id="selectCompletadas" class="form-select form-select-sm border-0 bg-transparent text-end fw-bold text-secondary" style="width: auto; cursor: pointer;">
                            <option value="none">Mostrar todo</option>
                            <option value="name">Por Nombre</option>
                            <option value="priority">Por Prioridad</option>
                            <option value="dateRange">Finalización</option>
                        </select>
                        <div id="filterInputContainerCompleted" class="d-flex align-items-center gap-2"></div>
                    </div>
                </div>

                <div id="completed-tasks"></div>
                <div id="completed-pagination-container" class="pagination-container d-flex justify-content-center mt-3"></div>
            </div>
        </div>
    </main>

    <div id="bulk-action-bar" class="fixed-bottom bg-dark text-white p-3 shadow-lg" style="display: none; z-index: 1050;">
        <div class="container d-flex justify-content-between align-items-center">
            <span id="selected-count" class="fw-bold small text-white-50">0 seleccionadas</span>
            <div>
                <button id="bulk-complete-btn" class="btn btn-sm btn-success me-2 fw-bold" disabled onclick="processBulkAction('complete')">
                    <i class="bi bi-check-lg me-1"></i> Completar
                </button>
                <button id="bulk-uncomplete-btn" class="btn btn-sm btn-warning me-2 fw-bold" disabled onclick="processBulkAction('uncomplete')">
                    <i class="bi bi-arrow-counterclockwise me-1"></i> Desmarcar
                </button>
                <button id="bulk-delete-btn" class="btn btn-sm btn-danger fw-bold" disabled onclick="processBulkAction('delete')">
                    <i class="bi bi-trash me-1"></i> Eliminar
                </button>
           </div>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="newTaskForm" class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white border-0 rounded-top-4">
                    <h5 class="modal-title fw-bold" id="modalTitle">Detalles de la Tarea</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="taskID">
                    <div class="mb-3">
                        <label class="form-label text-secondary small fw-bold">TÍTULO DE LA TAREA</label>
                        <input type="text" class="form-control form-control-lg bg-light border-0" id="taskName" required maxlength="100" placeholder="¿Qué hay que hacer?">
                    </div>
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label text-secondary small fw-bold">FECHA Y HORA VENCIMIENTO</label>
                            <input type="datetime-local" class="form-control bg-light border-0" id="taskDateTime" required>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label text-secondary small fw-bold">PRIORIDAD</label>
                            <select class="form-select bg-light border-0" id="taskPriority">
                                <option value="urgente">🔥 Urgente</option>
                                <option value="alta">⬆️ Alta</option>
                                <option value="media" selected>⏺️ Media</option>
                                <option value="baja">⬇️ Baja</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3 mt-3">
                        <label class="form-label text-secondary small fw-bold">NOTAS / DESCRIPCIÓN</label>
                        <textarea class="form-control bg-light border-0" id="taskNotes" rows="3" placeholder="Detalles adicionales..."></textarea>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold shadow" id="saveTaskBtn">Guardar Tarea</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="settingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <form id="settingsForm" class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0 pb-0">
                    <h6 class="modal-title fw-bold text-uppercase small text-secondary">Ajustes de Lista</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="settingsListType">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Orden por defecto</label>
                        <select class="form-select form-select-sm" id="defaultSort">
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Tareas por página</label>
                        <select class="form-select form-select-sm" id="itemsPerPage">
                            <option value="5">5 tareas</option>
                            <option value="10">10 tareas</option>
                            <option value="20">20 tareas</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary btn-sm w-100 rounded-pill fw-bold">Aplicar</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal fade" id="profileSettingsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold"><i class="bi bi-gear-fill me-2 text-primary"></i>Configuración de Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4 pb-4">
                    <form id="profileSettingsForm">
                        
                        <div class="mb-4 text-center">
    <h6 class="fw-bold text-dark mb-3 text-start"><i class="bi bi-person-circle me-2 text-primary"></i>Información Personal</h6>
    <div class="card bg-light border-0 rounded-3 p-3">
        <div class="position-relative d-inline-block mb-3">
            <img id="profilePreview" src="https://via.placeholder.com/80" class="rounded-circle border shadow-sm" style="width: 80px; height: 80px; object-fit: cover;">
        </div>
        
        <div class="mb-3 text-start">
            <label class="small text-muted mb-1 fw-bold">Nombre</label>
            <input type="text" class="form-control" id="profileDisplayName">
        </div>
        <div class="mb-3 text-start">
            <label class="small text-muted mb-1 fw-bold">Correo</label>
            <input type="email" class="form-control" id="profileEmail">
        </div>
        <div class="mb-0 text-start">
            <label class="small text-muted mb-1 fw-bold">Subir nueva foto</label>
            <input type="file" class="form-control" id="profileFile" accept="image/*">
            <div id="uploadStatus" class="small mt-1 text-primary d-none">Guardando cambios...</div>
        </div>
    </div>
</div>
                           

                        <div class="mb-4">
                            <h6 class="fw-bold text-dark mb-3">🔔 Alertas Visuales (Campana)</h6>
                            <div class="card bg-light border-0 rounded-3 p-3">
                                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-2">
                                    <label class="form-check-label fw-bold" for="bellEnabled">Notificar vencimientos próximos</label>
                                    <input class="form-check-input ms-0" type="checkbox" id="bellEnabled" checked>
                                </div>
                                <div id="bellConfigContainer" class="mt-2 border-top pt-2">
                                    <label class="small text-muted mb-2">Avisar con anticipación de:</label>
                                    <div class="input-group input-group-sm">
                                        <input type="number" class="form-control" id="bellValue" min="1" value="1">
                                        <select class="form-select" id="bellUnit">
                                            <option value="m">Minutos</option>
                                            <option value="h" selected>Horas</option>
                                            <option value="d">Días</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <h6 class="fw-bold text-dark mb-3">📧 Resumen de Tareas por Email</h6>
                            <div class="card bg-light border-0 rounded-3 p-3">
                                <div class="form-check form-switch d-flex justify-content-between align-items-center ps-0 mb-2">
                                    <label class="form-check-label fw-bold" for="emailSummaryEnabled">Recibir correo automático</label>
                                    <input class="form-check-input ms-0" type="checkbox" id="emailSummaryEnabled">
                                </div>
                                <div id="emailSummaryConfigContainer" class="mt-2 border-top pt-2" style="display: none;">
                                    <label class="small text-muted mb-2">Frecuencia de envío:</label>
                                    <select class="form-select form-select-sm" id="emailSummaryUnit">
                                        <option value="d">Diario</option>
                                        <option value="w">Semanal</option>
                                        <option value="mo">Mensual (Recomendado)</option>
                                        <option value="y">Anual</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-light w-100 rounded-pill fw-bold" data-bs-dismiss="modal">Cancelar</button>
                            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold shadow">Guardar Cambios</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script type="module" src="/src/script.js"></script>
</body>
</html>
