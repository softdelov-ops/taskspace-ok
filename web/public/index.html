<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskSpace</title>
    <link rel="icon" href="favicon.png" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #f8f9fa, #e3eaf5);
        color: #212529;
      }
      .navbar {
        backdrop-filter: blur(8px);
        background-color: rgba(255, 255, 255, 0.85);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      }
      .card-task {
        border-left: 5px solid #0d6efd;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light px-4 py-3">
      <a class="navbar-brand fw-bold" href="#">TaskSpace</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Perfil</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cerrar sesión</a></li>
        </ul>
      </div>
    </nav>

    <!-- Main -->
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-semibold">Tus tareas</h2>
        <button class="btn btn-primary">+ Nueva tarea</button>
      </div>

      <!-- Task cards -->
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card card-task shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📝 Redactar informe final</h5>
              <p class="card-text">📅 Vence: 18 oct 2025, 14:00</p>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm">Editar</button>
                <button class="btn btn-outline-danger btn-sm">Eliminar</button>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card card-task shadow-sm">
            <div class="card-body">
              <h5 class="card-title">📢 Enviar recordatorios</h5>
              <p class="card-text">📅 Vence: 19 oct 2025, 09:00</p>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-primary btn-sm">Editar</button>
                <button class="btn btn-outline-danger btn-sm">Eliminar</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
